            { name: "DROID", cat: "man", year: 2024, tags: ["Real World", "Large Scale"], desc: "包含 76,000 条真实世界机械臂轨迹，由分布在全球的多个实验室共同采集，强调环境泛化。", highlight: "目前最大的真实世界 Franka 操控数据集。", link: "https://droid-dataset.github.io/" },
            { name: "MimicGen", cat: "man", year: 2023, tags: ["Data Augmentation"], desc: "通过少量人类演示自动生成数百万个高质量机械臂轨迹的系统。", highlight: "通过自动化手段解决实机数据稀缺问题。", link: "https://mimicgen.github.io/" },
            { name: "LIBERO", cat: "man", year: 2023, tags: ["Lifelong Learning"], desc: "专注于机器人终身学习与知识迁移，包含 5 个任务库，适合研究持续学习策略。", highlight: "填补了机器人持续学习评价的空白。", link: "https://libero-project.github.io/" },

            // --- EGO-CENTRIC ---
            { name: "Ego4D", cat: "ego", year: 2022, tags: ["Action", "Ego-Video"], desc: "目前最庞大的第一视角视频库，包含 3670 小时的日常活动，覆盖社交、预测等五个挑战。", highlight: "构建人类意图预测模型的顶级教材。", link: "https://ego4d-data.org/" },
            { name: "Ego-Exo4D", cat: "ego", year: 2024, tags: ["Multi-view", "Skill Learning"], desc: "Meta 发布。同时记录佩戴者和旁观者视角，用于复杂技能（维修、体育、乐器）的学习。", highlight: "完美解决主观与客观视角对齐。", link: "https://ego-exo4d-data.org/" },
            { name: "Aria Everyday Activities", cat: "ego", year: 2024, tags: ["Eye-tracking", "SLAM"], desc: "使用 Meta Aria 眼镜采集，包含眼动、音频、双目视频，揭示了人类活动中的注意力分配。", highlight: "提供了极高精度的佩戴者意图信号。", link: "https://www.projectaria.com/datasets/aea/" }
        ];

        // --- STATE MANAGEMENT ---
        let state = { filter: 'all', query: '' };

        const goHome = () => {
            window.location.href = '/';
        };

        const scrollToExplorer = () => {
            document.getElementById('explorerSection').scrollIntoView({ behavior: 'smooth' });
        };

        const updateActiveFilterPill = (cat) => {
            document.querySelectorAll('.filter-pill').forEach(btn => {
                if(btn.dataset.cat === cat) {
                    btn.classList.add('active', 'bg-accent-cyan', 'text-cyber-slate');
                    btn.classList.remove('bg-white/5', 'text-soft-text');
                } else {
                    btn.classList.remove('active', 'bg-accent-cyan', 'text-cyber-slate');
                    btn.classList.add('bg-white/5', 'text-soft-text');
                }
            });
        };

        const renderCards = () => {
            const grid = document.getElementById('datasetGrid');
            grid.innerHTML = '';
            
            const filtered = datasets.filter(d => {
                const matchesSearch = d.name.toLowerCase().includes(state.query.toLowerCase()) || 
                                     d.desc.toLowerCase().includes(state.query.toLowerCase()) ||
                                     d.tags.some(t => t.toLowerCase().includes(state.query.toLowerCase()));
                let matchesFilter = state.filter === 'all' || d.cat === state.filter;
                if(state.filter === '2025') matchesFilter = d.is2025 === true;
                return matchesSearch && matchesFilter;
            });

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-panel p-6 rounded-2xl data-card flex flex-col justify-between";
                
                let badgeStyle = "bg-white/10 text-soft-text";
                let badgeLabel = "其他";
                if(item.cat === 'auto') { badgeStyle = "bg-blue-500/20 text-blue-400"; badgeLabel = "自动驾驶"; }
                if(item.cat === 'vln') { badgeStyle = "bg-purple-500/20 text-purple-400"; badgeLabel = "导航/VLN"; }
                if(item.cat === 'man') { badgeStyle = "bg-accent-cyan/20 text-accent-cyan"; badgeLabel = "操控与仿真"; }
                if(item.cat === 'ego') { badgeStyle = "bg-green-500/20 text-green-400"; badgeLabel = "第一视角"; }

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <span class="tag-pill ${badgeStyle}">${badgeLabel}</span>
                            <span class="text-[10px] font-bold text-white/20">${item.year}</span>
                        </div>
                        <h3 class="text-xl font-bold mb-2">${item.name} ${item.is2025 ? '<span class="text-accent-purple">✨2025</span>' : ''}</h3>
                        <p class="text-xs text-soft-text mb-4 leading-relaxed">${item.desc}</p>
                        <div class="flex flex-wrap gap-1 mb-6">
                            ${item.tags.map(t => `<span class="bg-white/5 text-[9px] px-2 py-0.5 rounded border border-white/5 text-soft-text uppercase">${t}</span>`).join('')}
                        </div>
                    </div>
                    <div class="pt-4 border-t border-white/5 flex flex-col gap-3">
                        <div class="text-[10px] italic text-soft-text border-l-2 border-accent-cyan pl-2">
                            "${item.highlight}"
                        </div>
                        <a href="${item.link}" target="_blank" class="text-xs font-bold text-accent-cyan hover:underline self-end">获取情报 ↗</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        // --- CHARTS ---
        function initCharts() {
            const ctxRadar = document.getElementById('radarChart').getContext('2d');
            new Chart(ctxRadar, {
                type: 'radar',
                data: {
                    labels: ['视觉质量', '交互闭环', '标注规模', '多样性', '语意深度'],
                    datasets: [{
                        label: '2025 重点项目 (如 Robotwin)',
                        data: [95, 98, 85, 90, 85],
                        backgroundColor: 'rgba(34, 211, 238, 0.2)',
                        borderColor: '#22d3ee',
                        pointBackgroundColor: '#22d3ee'
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: { r: { ticks: { display: false }, grid: { color: 'rgba(255,255,255,0.1)' }, angleLines: { color: 'rgba(255,255,255,0.1)' } } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // --- LISTENERS ---
        document.getElementById('megaSearch').addEventListener('input', (e) => {
            state.query = e.target.value;
            renderCards();
        });

        document.getElementById('filterPills').addEventListener('click', (e) => {
            if(e.target.classList.contains('filter-pill')) {
                const cat = e.target.dataset.cat;
                state.filter = cat;
                updateActiveFilterPill(cat);
                renderCards();
            }
        });

        window.onload = () => {
            renderCards();
            initCharts();
        };

    </script>
</body>
</html>
